name: ci
# One run per change: pushes to main, and pull requests (not also the push to the PR branch). Prose that no
# test reads doesn't run the matrix. CLAUDE.md, AGENTS.md, GEMINI.md, BOUNDARY.md and docs-site/ are tested,
# so they are not in this list.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'HANDOVER.md'
      - 'LAYOUT.md'
      - 'OPEN-CORE.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'HANDOVER.md'
      - 'LAYOUT.md'
      - 'OPEN-CORE.md'
# A newer push to the same pull request replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run check:boundary
      - run: npm run build
      - run: npm test
      - name: the npm package carries no closed code
        run: npm run check:boundary -- --pack
      - name: the gym (scripted stakeholders; the interviewer must not regress)
        run: node dist/cli.js gym
