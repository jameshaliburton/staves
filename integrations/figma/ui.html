<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px Inter,system-ui,sans-serif;margin:0;padding:24px;color:var(--figma-color-text,#252832);background:var(--figma-color-bg,#fff)}h1{font-size:20px;margin:0 0 12px}p{line-height:1.5;color:var(--figma-color-text-secondary,#626976)}label{display:block;font-weight:600;margin:20px 0 8px}input{width:100%;box-sizing:border-box;border:1px solid var(--figma-color-border-strong,#808b99);padding:12px;border-radius:6px}button{margin-top:20px;border:0;border-radius:6px;background:#2455e6;color:white;padding:12px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #2455e6;outline-offset:3px}#status{min-height:38px}#status.error{color:var(--figma-color-text-danger,#a43245)}</style></head><body><h1>Import a Staves workflow</h1><p>Create editable roles, jobs, tasks and review notes from a JSON handoff. Each import adds a separate snapshot to this file.</p><label for="file">Staves JSON handoff</label><input id="file" type="file" accept=".json,application/json"><button id="import" disabled>Import editable workflow</button><p id="status" role="status" aria-live="polite">Choose the JSON file downloaded from Staves.</p><script>
const file=document.querySelector('#file'),button=document.querySelector('#import'),status=document.querySelector('#status');
file.onchange=()=>{button.disabled=!file.files.length;status.className='';status.textContent=file.files.length?'Ready to import '+file.files[0].name:'Choose a JSON handoff.';};
button.onclick=async()=>{const selected=file.files[0];if(!selected)return;button.disabled=true;file.disabled=true;status.className='';status.textContent='Importing editable objects…';try{if(selected.size>5000000)throw new Error('Choose a file smaller than 5 MB. Export a smaller selection from Staves.');parent.postMessage({pluginMessage:{type:'import',text:await selected.text()}},'*');}catch(error){status.textContent=error.message;status.className='error';button.disabled=false;file.disabled=false;}};
onmessage=event=>{const message=event.data.pluginMessage;if(!message||!['success','error'].includes(message.type))return;status.textContent=message.message;status.className=message.type==='error'?'error':'';file.disabled=false;button.disabled=message.type==='success';if(message.type==='success')file.value='';};
</script></body></html>
